[project]
name = "video-transcript-rag"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "groq>=1.6.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# the modules under test sit at the repo root, not in a package
pythonpath = ["."]
testpaths = ["tests"]
